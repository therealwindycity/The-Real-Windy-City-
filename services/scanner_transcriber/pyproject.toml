[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "civic-cheyenne-scanner-transcriber"
version = "0.1.0"
description = "Continuous live radio scanner capture, faster-whisper ASR, durable SQLite storage, and health/cursor API for Civic Cheyenne."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "faster-whisper==1.2.1",
  "ctranslate2==4.8.3",
  "onnxruntime==1.31.0",
  "fastapi==0.158.1",
  "uvicorn==0.54.0",
  "pydantic==2.14.1",
  "httpx==0.28.1",
  "numpy==2.4.6",
  "scipy==1.17.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
]

[project.scripts]
scanner-transcriber = "scanner_transcriber.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scanner_transcriber*"]

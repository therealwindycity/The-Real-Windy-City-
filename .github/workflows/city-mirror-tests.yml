name: City mirror tests
# Runs on pull requests touching the mirror, evidence pages, or their tests.
# Pushes to publishing branches are covered by the Deploy site workflow's
# publish job, which runs the same offline tests plus browser-script checks.
on:
  pull_request:
    paths:
      - 'city/**'
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run offline fixture tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate browser script syntax
        run: |
          for f in city/city.js city/mirror-search.js city/portal.js city/coverage.js; do
            node --check "$f"
          done
      - name: Render an honest empty-state mirror
        run: |
          python3 tools/sync_city.py --render-only
          test -f city/mirror/index.html
          test -f city/mirror/status.html

name: Fetch meeting transcripts

# Downloads captions for catalog entries in cheyenne-2026-transcripts/
# meetings.json that do not have a transcript file yet, converts them with
# tools/fetch_transcripts.py, rebuilds coverage, runs the test suite, and
# commits the result back to the ref the workflow was dispatched on.
#
# Manual dispatch only: caption availability and wording are evidence, so a
# human chooses when a collection run happens (and reviews the commit).
# Dispatch it on the branch that should receive the transcript commit.

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Optional comma-separated YouTube IDs to limit the run"
        required: false
        default: ""
      probe:
        description: "Also run caption-source diagnostics"
        required: false
        default: "false"
  # Fallback for tokens that can push but cannot dispatch workflows:
  # a push whose head-commit message contains [fetch-transcripts] runs the
  # same job. The bot's own result commit never contains the marker, so
  # this cannot loop. Ordinary pushes do not fetch anything.
  push:
    branches:
      - main
      - "arena/**"

permissions:
  contents: write

concurrency:
  group: fetch-transcripts-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  fetch:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[fetch-transcripts]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yt-dlp
        run: |
          pip install -q "yt-dlp[default]" curl-cffi
          yt-dlp --version

      - name: Probe caption sources (diagnostics, never fails the job)
        if: inputs.probe == 'true' || contains(github.event.head_commit.message, '[fetch-probe]')
        continue-on-error: true
        run: |
          set +e
          cat > /tmp/probe.py <<'PYEOF'
          import re, sys
          def say(msg):
              print("::notice title=probe::" + re.sub(r"\s+", " ", str(msg))[:900])
          try:
              from curl_cffi import requests as creq
          except Exception as e:
              say(f"curl_cffi import fail: {e}"); sys.exit(0)
          def probe(name, url, pats=("caption", ".vtt", ".m3u8", ".mp4")):
              try:
                  r = creq.get(url, impersonate="chrome", timeout=30)
                  body = r.text or ""
                  hits = []
                  for p in pats:
                      hits += [m.group(0)[:110] for m in re.finditer(r"[^\"<> ]*" + re.escape(p) + r"[^\"<> ]*", body, re.I)][:3]
                  say(f"{name}: HTTP {r.status_code} {len(body)}B hits={hits[:6]}")
                  return body
              except Exception as e:
                  say(f"{name}: FAIL {type(e).__name__}: {str(e)[:180]}")
                  return ""
          probe("GRANICUS player 1139 (impersonate)", "https://cheyenne.granicus.com/player/clip/1139?view_id=5&redirect=true")
          probe("GRANICUS MediaPlayer 1139", "https://cheyenne.granicus.com/MediaPlayer.php?view_id=5&clip_id=1139")
          body = probe("GRANICUS ViewPublisher v5", "https://cheyenne.granicus.com/ViewPublisher.php?view_id=5", pats=("<title>", "clip/"))
          titles = re.findall(r"<title>([^<]*)", body or "", re.I)
          say(f"ViewPublisher title: {titles[:1]}")
          probe("GRANICUS GeneratedAgendaViewer ev1448", "https://cheyenne.granicus.com/GeneratedAgendaViewer.php?view_id=5&event_id=1448", pats=("agenda",))
          probe("GRANICUS rss guess", "https://cheyenne.granicus.com/rss.php?view_id=5", pats=("rss", "item"))
          PYEOF
          python3 /tmp/probe.py
          say2() { echo "::notice title=probe::$(echo "$1" | tr -d '\n\r' | cut -c1-900)"; }
          out=$(yt-dlp --impersonate chrome --list-subs --skip-download "https://cheyenne.granicus.com/player/clip/1139?view_id=5&redirect=true" 2>&1)
          say2 "YT-DLP impersonate granicus list-subs: $(echo "$out" | tail -3 | tr '\n' ' ')"
          out=$(curl -s -o /dev/null -w "%{http_code} %{size_download}" -m 25 -A "Mozilla/5.0" "https://archive-stream.granicus.com/OnDemand/_definst_/mp4:archive/cheyenne/nonexistent.mp4/playlist.m3u8")
          say2 "ARCHIVE-STREAM host reachability (expect 404-ish): $out"

      - name: Upload probe artifacts
        if: always() && (inputs.probe == 'true' || contains(github.event.head_commit.message, '[fetch-probe]'))
        uses: actions/upload-artifact@v4
        with:
          name: caption-probe
          path: |
            /tmp/granicus-1139.json
            /tmp/granicus-1139.err
            /tmp/inv.json
            /tmp/piped.json
          if-no-files-found: ignore

      - name: Prepare optional YouTube cookies
        # YouTube bot-gates datacenter IPs ("Sign in to confirm you're not a
        # bot"), which blocks unauthenticated caption downloads from Actions
        # runners. THAT IS EXPECTED: run tools/fetch_transcripts.py locally
        # (residential IP) instead — see cheyenne-2026-transcripts/README.md.
        # Only if the repository owner deliberately adds a YOUTUBE_COOKIES
        # secret (Netscape cookies.txt from a THROWAWAY Google account) will
        # the fetch use it. Unset = no cookies anywhere near this workflow.
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            printf '%s' "$YOUTUBE_COOKIES" > /tmp/yt-cookies.txt
            chmod 600 /tmp/yt-cookies.txt
            echo "YTDLP_COOKIES_FILE=/tmp/yt-cookies.txt" >> "$GITHUB_ENV"
            echo "Using owner-provided YOUTUBE_COOKIES secret."
          else
            echo "No YOUTUBE_COOKIES secret; unauthenticated fetch (YouTube may bot-gate this runner)."
          fi

      - name: Fetch pending transcripts
        id: fetch
        run: |
          set -o pipefail
          if [ -n "${{ inputs.only }}" ]; then
            python3 tools/fetch_transcripts.py fetch --only "${{ inputs.only }}" 2>&1 | tee /tmp/fetch-output.txt
          else
            python3 tools/fetch_transcripts.py fetch 2>&1 | tee /tmp/fetch-output.txt
          fi

      - name: Publish fetch output to job summary
        if: always()
        run: |
          {
            echo "## Fetch output"
            echo '```'
            tail -100 /tmp/fetch-output.txt 2>/dev/null || echo "(no output captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Rebuild coverage counts
        run: python3 tools/build_archive_coverage.py

      - name: Test before committing
        run: python3 -m unittest discover -s tests -v

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cheyenne-2026-transcripts city index.html
          if git diff --cached --quiet; then
            echo "No transcript changes to commit."
            echo "## No changes" >> "$GITHUB_STEP_SUMMARY"
          else
            git diff --cached --stat | tail -30
            git commit -m "Fetch pending meeting transcripts (automated caption download)"
            git push origin HEAD:${{ github.ref_name }}
            {
              echo "## Transcripts fetched"
              echo '```'
              git show --stat --format='%h %s' HEAD | tail -30
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
